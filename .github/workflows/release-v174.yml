name: Build and publish v2.9.174 canvas tools
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v2.9.174
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release base
        run: test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.173
      - name: Prepare tools and verified app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y nsis p7zip-full
          gh release download v2.9.173 --pattern SENZ-STUDIO-UPDATE-v2.9.173.exe
          python3 release-tools/v174/prepare.py
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Test real canvas interactions
        run: node release-tools/v174/ui-test.cjs
      - name: Preserve interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-interaction-check
          path: ui-artifacts/
          retention-days: 14
      - name: Package and verify all files
        run: |
          SENZ_APP="$PWD/payload/resources/app" node --test release-tools/demo.test.cjs
          python3 release-tools/v174/package.py
      - name: Upload and publish verified installer
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.173
          gh release create v2.9.174 SENZ-STUDIO-UPDATE-v2.9.174.exe SHA256SUMS.txt --draft --target "$GITHUB_SHA" --title 'SENZ STUDIO v2.9.174 - Quick Font, Guides & Zoom' --notes-file release-tools/v174/NOTES.md
          rid=$(gh api repos/$GH_REPO/releases --jq '.[] | select(.tag_name=="v2.9.174" and .draft==true) | .id')
          test -n "$rid"
          gh api repos/$GH_REPO/releases/$rid > draft174.json
          node <<'JS'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const d=JSON.parse(fs.readFileSync('draft174.json')),name='SENZ-STUDIO-UPDATE-v2.9.174.exe';
          const a=d.assets.find(a=>a.name===name),file=fs.readFileSync(name),sha=crypto.createHash('sha256').update(file).digest('hex');
          if(!a||a.size!==file.length||a.digest!=='sha256:'+sha)throw Error('Uploaded installer mismatch');
          for(const a of d.assets)a.browser_download_url=`https://github.com/${process.env.GH_REPO}/releases/download/${d.tag_name}/${a.name}`;
          if(!require(path.resolve('payload/resources/app/update-core.cjs')).release({...d,draft:false},process.env.GH_REPO,'2.9.173'))throw Error('Updater rejected metadata');
          JS
          gh api --method PATCH repos/$GH_REPO/releases/$rid -F draft=false -f make_latest=true > published174.json
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.174
          node <<'JS'
          const fs=require('fs'),path=require('path'),d=JSON.parse(fs.readFileSync('published174.json'));
          if(!require(path.resolve('payload/resources/app/update-core.cjs')).release(d,process.env.GH_REPO,'2.9.173'))throw Error('Published metadata rejected');
          JS
