name: Publish verified v2.9.173 draft
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-demo.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v2.9.173
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the existing draft and both uploaded assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.172
          gh api repos/$GH_REPO/releases/435840052 > draft.json
          python3 <<'PY'
          import json
          d=json.load(open('draft.json'))
          assert d['draft'] and d['tag_name']=='v2.9.173'
          assert d['target_commitish']=='a78aa5af76e6e4a92ce8e850f0ba84b0ef09b0f3'
          a=next(a for a in d['assets'] if a['name']=='SENZ-STUDIO-UPDATE-v2.9.173.exe')
          assert a['id']==715059823 and a['size']==557342482
          assert a['digest']=='sha256:99096180930fa0ce1089f178c1ca99582c4cb4023aa7b2e9278dc0dfe7089167'
          PY
          gh api -H 'Accept: application/octet-stream' repos/$GH_REPO/releases/assets/715059823 > SENZ-STUDIO-UPDATE-v2.9.173.exe
          gh api -H 'Accept: application/octet-stream' repos/$GH_REPO/releases/assets/715059826 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo '99096180930fa0ce1089f178c1ca99582c4cb4023aa7b2e9278dc0dfe7089167  SENZ-STUDIO-UPDATE-v2.9.173.exe' | sha256sum -c -
          7z x -y SENZ-STUDIO-UPDATE-v2.9.173.exe -overify > extraction.log
          SENZ_APP="$PWD/verify/\$PLUGINSDIR/payload/resources/app" node --test release-tools/demo.test.cjs
          node <<'JS'
          const fs=require('fs'),path=require('path');
          const root=path.resolve('verify/$PLUGINSDIR/payload/resources/app');
          if(require(path.join(root,'package.json')).version!=='2.9.173')throw Error('Version mismatch');
          const d=JSON.parse(fs.readFileSync('draft.json'));
          for(const a of d.assets)a.browser_download_url=`https://github.com/${process.env.GH_REPO}/releases/download/${d.tag_name}/${a.name}`;
          if(!require(path.join(root,'update-core.cjs')).release({...d,draft:false},process.env.GH_REPO,'2.9.172'))throw Error('Updater rejected release');
          JS
      - name: Publish the verified draft by release ID
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.172
          gh api --method PATCH repos/$GH_REPO/releases/435840052 -F draft=false -f make_latest=true > published.json
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.173
          node <<'JS'
          const fs=require('fs'),path=require('path');
          const d=JSON.parse(fs.readFileSync('published.json'));
          const updater=require(path.resolve('verify/$PLUGINSDIR/payload/resources/app/update-core.cjs'));
          if(!updater.release(d,process.env.GH_REPO,'2.9.172'))throw Error('Published release rejected by updater');
          JS
