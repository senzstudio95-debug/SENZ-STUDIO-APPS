name: Publish v2.9.173 - seven-day demo
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v2.9.173
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Require unchanged latest release
        run: test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.172
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y nsis p7zip-full
      - name: Download verified base
        run: gh release download v2.9.172 --pattern SENZ-STUDIO-UPDATE-v2.9.172.exe
      - name: Build and verify complete Windows installer
        run: python3 release-tools/build.py
      - name: Upload draft, verify digest, and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.172
          gh release create v2.9.173 SENZ-STUDIO-UPDATE-v2.9.173.exe SHA256SUMS.txt --draft --target "$GITHUB_SHA" --title 'SENZ STUDIO v2.9.173 - Demo 7 Hari' --notes-file release-tools/NOTES.md
          gh api repos/$GH_REPO/releases/tags/v2.9.173 > uploaded-release.json
          node <<'JS'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const r=JSON.parse(fs.readFileSync('uploaded-release.json'));
          const name='SENZ-STUDIO-UPDATE-v2.9.173.exe',a=r.assets.find(a=>a.name===name);
          const f=fs.readFileSync(name),sha=crypto.createHash('sha256').update(f).digest('hex');
          if(!a||a.size!==f.length||a.digest!=='sha256:'+sha)throw Error('Uploaded installer SHA-256 mismatch');
          const updater=require(path.resolve('payload/resources/app/update-core.cjs'));
          if(!updater.release({...r,draft:false},process.env.GH_REPO,'2.9.172'))throw Error('Updater rejected release');
          JS
          gh release edit v2.9.173 --draft=false --latest
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v2.9.173
